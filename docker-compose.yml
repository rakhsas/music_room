services:
  # PostgreSQL Database
  db:
    container_name: postgres_db
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: musicroom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    container_name: redis
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    ports:
      - "8081:8080"

  # Every setting lives in the root .env (the one file for backend + web, see .env.example).
  # Compose reads it twice: as the backend's env_file, and to fill the ${...} below.
  # A value containing "$" must be single-quoted there, or Compose expands it.
  # API_PORT / WEB_PORT (default 8000 / 3000) change the published ports if those are taken.

  # NestJS API.
  backend:
    container_name: musicroom_backend
    build: ./Backend-Nest
    restart: always
    env_file: .env
    environment:
      PORT: 8000 # port inside the container; the published one is API_PORT
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Next.js web app. NEXT_PUBLIC_* are baked in at build time; the API URL must be the address
  # the browser uses (localhost:<API_PORT>), never the "backend" container name.
  web:
    container_name: musicroom_web
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: always
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: